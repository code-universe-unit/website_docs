name: Deploy to GitHub Pages

on:
  # Запускается при push в main ветку
  push:
    branches: [main]
  
  # Позволяет запускать вручную из вкладки Actions
  workflow_dispatch:

# Права для публикации в GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешить только один конкурентный деплой
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Сборка сайта
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Нужно для lastUpdated

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # Деплой на GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
