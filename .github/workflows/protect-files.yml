name: Protect Important Files

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-protected-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes in protected files
        run: |
          # Список защищенных файлов
          PROTECTED_FILES=(
            "docs/.vitepress/config.ts"
            "docs/.vitepress/theme/style.css"
            ".github/workflows/deploy.yml"
          )
          
          # Получаем список измененных файлов
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Проверяем каждый файл
          PROTECTED_CHANGED=""
          for file in $CHANGED_FILES; do
            for protected in "${PROTECTED_FILES[@]}"; do
              if [ "$file" == "$protected" ]; then
                PROTECTED_CHANGED="$PROTECTED_CHANGED\n- $file"
              fi
            done
          done
          
          if [ ! -z "$PROTECTED_CHANGED" ]; then
            echo "❌ ОШИБКА: Обнаружены изменения в защищенных файлах:"
            echo -e "$PROTECTED_CHANGED"
            echo ""
            echo "Эти файлы защищены от прямых изменений."
            echo "Обратитесь к администратору репозитория."
            exit 1
          fi
          
          echo "✅ Защищенные файлы не изменены"
